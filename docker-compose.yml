services:
  victim:
    image: ubuntu:22.04
    container_name: victim
    hostname: victim
    tty: true
    stdin_open: true
    networks:
      lab_net:
        ipv4_address: 172.28.0.10
    ports:
      - "2222:22"
      - "8080:80"
    command: >
      bash -c "apt update &&
      apt install -y openssh-server apache2 sudo iputils-ping &&
      service ssh start &&
      service apache2 start &&
      useradd -m -s /bin/bash testuser &&
      echo 'testuser:123456' | chpasswd &&
      tail -f /dev/null"

  kali:
    image: kalilinux/kali-rolling
    container_name: kali
    hostname: kali
    tty: true
    stdin_open: true
    networks:
      lab_net:
        ipv4_address: 172.28.0.20
    command: >
      bash -c "apt update &&
      apt install -y nmap hydra iputils-ping &&
      tail -f /dev/null"

  server3:
    image: ubuntu:22.04
    container_name: server3
    hostname: server3
    tty: true
    stdin_open: true
    networks:
      lab_net:
        ipv4_address: 172.28.0.30
    ports:
      - "8081:80"
    command: >
      bash -c "apt update &&
      apt install -y iputils-ping &&
      tail -f /dev/null"

networks:
  lab_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24